<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Appointment - MediCare</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ========================================
         NAVIGATION BAR
    ========================================= -->

    <nav class="navbar">

        <div class="logo">
            🩺 MediCare
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="doctors.html">
                Doctors
            </a>

            <a
                href="appointment.html"
                class="active"
            >
                Book Appointment
            </a>

            <a href="appointments.html">
                My Appointments
            </a>

            <a href="admin.html">
                Admin
            </a>

        </div>

    </nav>



    <!-- ========================================
         APPOINTMENT SECTION
    ========================================= -->

    <section class="appointment-section">


        <div class="appointment-header">

            <h1>
                Book Your Appointment
            </h1>

            <p>
                Fill in your details and select a
                convenient date and time.
            </p>

        </div>



        <!-- ========================================
             APPOINTMENT FORM
        ========================================= -->

        <form
            id="appointmentForm"
            class="appointment-form"
        >


            <!-- ====================================
                 DOCTOR INFORMATION
            ===================================== -->

            <div class="form-section">

                <h2>
                    👨‍⚕️ Doctor Information
                </h2>


                <div class="form-group">

                    <label for="doctor">
                        Select Doctor
                        <span>*</span>
                    </label>


                    <select
                        id="doctor"
                        required
                    >

                        <option value="">
                            -- Select Doctor --
                        </option>

                    </select>

                </div>

            </div>



            <!-- ====================================
                 PATIENT INFORMATION
            ===================================== -->

            <div class="form-section">

                <h2>
                    👤 Patient Information
                </h2>


                <div class="form-row">


                    <!-- Patient Name -->

                    <div class="form-group">

                        <label for="patientName">
                            Patient Name
                            <span>*</span>
                        </label>


                        <input
                            type="text"
                            id="patientName"
                            placeholder="Enter patient name"
                            required
                        >

                    </div>



                    <!-- Age -->

                    <div class="form-group">

                        <label for="age">
                            Age
                            <span>*</span>
                        </label>


                        <input
                            type="number"
                            id="age"
                            placeholder="Enter age"
                            min="1"
                            max="120"
                            required
                        >

                    </div>


                </div>



                <div class="form-row">


                    <!-- Gender -->

                    <div class="form-group">

                        <label for="gender">
                            Gender
                            <span>*</span>
                        </label>


                        <select
                            id="gender"
                            required
                        >

                            <option value="">
                                -- Select Gender --
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>



                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                            <span>*</span>
                        </label>


                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter 10-digit phone number"
                            maxlength="10"
                            required
                        >

                    </div>


                </div>



                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                    >

                </div>

            </div>



            <!-- ====================================
                 APPOINTMENT DETAILS
            ===================================== -->

            <div class="form-section">

                <h2>
                    📅 Appointment Details
                </h2>


                <div class="form-row">


                    <!-- Date -->

                    <div class="form-group">

                        <label for="appointmentDate">
                            Appointment Date
                            <span>*</span>
                        </label>


                        <input
                            type="date"
                            id="appointmentDate"
                            required
                        >

                    </div>



                    <!-- Time -->

                    <div class="form-group">

                        <label for="appointmentTime">
                            Appointment Time
                            <span>*</span>
                        </label>


                        <select
                            id="appointmentTime"
                            required
                        >

                            <option value="">
                                -- Select Time --
                            </option>

                            <option value="09:00 AM">
                                09:00 AM
                            </option>

                            <option value="10:00 AM">
                                10:00 AM
                            </option>

                            <option value="11:00 AM">
                                11:00 AM
                            </option>

                            <option value="12:00 PM">
                                12:00 PM
                            </option>

                            <option value="02:00 PM">
                                02:00 PM
                            </option>

                            <option value="03:00 PM">
                                03:00 PM
                            </option>

                            <option value="04:00 PM">
                                04:00 PM
                            </option>

                            <option value="05:00 PM">
                                05:00 PM
                            </option>

                        </select>

                    </div>


                </div>



                <!-- Reason -->

                <div class="form-group">

                    <label for="reason">
                        Reason for Visit
                        <span>*</span>
                    </label>


                    <textarea
                        id="reason"
                        rows="4"
                        placeholder="Briefly describe your symptoms or reason for appointment"
                        required
                    ></textarea>

                </div>

            </div>



            <!-- ====================================
                 MESSAGE
            ===================================== -->

            <div
                id="formMessage"
                class="form-message"
            ></div>



            <!-- ====================================
                 SUBMIT BUTTON
            ===================================== -->

            <div class="appointment-submit">

                <button
                    type="submit"
                    class="appointment-submit-button"
                >
                    Confirm Appointment
                </button>

            </div>


        </form>

    </section>



    <!-- ========================================
         FOOTER
    ========================================= -->

    <footer>

        <p>
            © 2026 MediCare Doctor Appointment System
        </p>

        <p>
            Front-End Web Development Project
        </p>

    </footer>



    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="js/doctors.js"></script>

    <script src="js/common.js"></script>

    <script src="js/appointment.js"></script>


</body>

</html>
